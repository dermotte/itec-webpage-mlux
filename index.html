<script>
$(document).ready(function() {
    // Initialize the router
    initRouter();

    // Handle navigation clicks
    $('nav a').on('click', function(e) {
        // Don't interfere with external links or dropdown toggles
        if ($(this).attr('href') && $(this).attr('href').startsWith('index.html')) {
            e.preventDefault();
            var url = $(this).attr('href');
            var params = new URLSearchParams(url.split('?')[1] || '');
            var id = params.get('id');

            // Update URL without page reload
            if (id) {
                history.pushState({id: id}, '', 'index.html?id=' + id);
            } else {
                history.pushState({}, '', 'index.html');
            }

            // Load the content
            loadContent(id);
        }
    });
});

function initRouter() {
    // Parse current URL
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');

    // Set active navigation
    updateActiveNavigation(id);

    // Load initial content
    loadContent(id);
}

function updateActiveNavigation(id) {
    // Reset all nav items
    $('#nav-home, #nav-research, #nav-courses').removeClass('active');

    // Set active based on current page
    if (!id || id === 'main') {
        $('#nav-home').addClass('active');
    } else if (id === 'research') {
        $('#nav-research').addClass('active');
    } else if (id === 'courses') {
        $('#nav-courses').addClass('active');
    }
}

function loadContent(id) {
    var contentContainer = $('#content-container');
    contentContainer.html('<div class="text-center"><i class="fas fa-spinner fa-spin fa-3x"></i></div>');

    if (!id || id === 'main') {
        // Load main content
        $.get('main.html', function(data) {
            contentContainer.html(data);
        }).fail(function() {
            contentContainer.html('<h1>No such page!</h1>');
        });
    } else if (id.match(/^[a-z0-9\-]+$/)) {
        // Try to load as HTML file
        $.get(id + '.html', function(data) {
            contentContainer.html(data);
        }).fail(function() {
            // If HTML fails, try as PHP file (for backward compatibility during transition)
            $.get(id + '.php', function(data) {
                contentContainer.html(data);
            }).fail(function() {
                contentContainer.html('<h1>No such page!</h1>');
            });
        });
    } else if (id.match(/^(courses)?\/[a-z0-9\-]+\.md$/)) {
        // Handle Markdown files
        contentContainer.html('<div class="row" id="content"/>');
        var converter = new showdown.Converter();
        converter.setOption('tables', true);
        converter.setOption('strikethrough', true);

        $.get(id, function(data) {
            $("#content").html(converter.makeHtml(data));
        }).fail(function() {
            contentContainer.html('<h1>No such page!</h1>');
        });
    } else if (id.match(/^courses\/[a-z0-9\-]+$/)) {
        // Handle course HTML files
        $.get(id + '.html', function(data) {
            contentContainer.html(data);
        }).fail(function() {
            contentContainer.html('<h1>No such page!</h1>');
        });
    } else {
        contentContainer.html('<h1>No such page!</h1>');
    }
}

// Handle browser back/forward navigation
window.onpopstate = function(event) {
    var id = event.state ? event.state.id : null;
    updateActiveNavigation(id);
    loadContent(id);
};
</script>
